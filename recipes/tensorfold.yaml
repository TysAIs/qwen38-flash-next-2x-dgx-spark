# TensorFold lane — the same two-Spark cluster, a different engine.
#
# Published alongside recipes/vllm.yaml. Select with ENGINE=tensorfold ./run.sh
# The checkpoint is NOT chosen here: lib-lanes.sh resolves CHECKPOINT (stock | uncensored) and
# overrides `model` / `served-model-name`, so both lanes run either checkpoint.
#
# STATUS, measured 2026-09-29 on 2x DGX Spark (128 GB each), RDMA over the ConnectX link,
# Method-D quiet-gated forced-512, n=5 clean trials, both engines in the same session:
#
#   single stream (c=1)          TensorFold 94.0 tok/s   vLLM 64.2 tok/s   (+46%)
#   per-stream at c=16           TensorFold 82.7 tok/s   vLLM 29.5 tok/s   (+180%)
#   AGGREGATE at c=16            TensorFold 79.9 tok/s   vLLM 249.3 tok/s  (-68%)
#   draft acceptance             TensorFold 4.60 tok/round  vLLM 3.28        (+40%)
#
# TensorFold is the faster engine for one agent at a time. Its native two-node CONCURRENT path is
# not finished upstream and does not yet scale in aggregate, so this lane is single-stream / low
# concurrency today. Use the vLLM lane for many simultaneous clients. See docs/ENGINES.md.

server:
  image: tensorfold/tensorfold:0.5.0-ct-tp2          # TensorFold 0.5.0 + the qwen4_exp compressed-tensors
                                                      # port + native TP2. Built from patches/tensorfold-*.patch
                                                      # against upstream ashhart/TensorFold @ 9cd52ab.
  entrypoint: tensorfold                              # the binary, not vllm's python -m entry
  cpuset: "5-9,15-19"                                 # the GB10's 10 Cortex-X925 3.9GHz cores
  model: myllmbox/Qwen3.8-Flash-Next-hibrid48          # overridden by lib-lanes.sh (CHECKPOINT)
  port: 8888                                           # OpenAI API on the head box
  host: 0.0.0.0                                        # host networking; 127.0.0.1 keeps it local
  master_port: 25000                                   # torch.distributed rendezvous, on the interconnect
  models_dir: ./models
  cache_dir: ./cache

env:
  PYTHONUNBUFFERED: "1"                                # rank-1 load progress actually shows
  TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
  TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC: "180"              # die in 3 min on a stuck collective
  TORCH_CUDA_ARCH_LIST: "12.1a"
  FLASHINFER_CUDA_ARCH_LIST: "12.1a"
  NCCL_IB_GID_INDEX: "3"
  NCCL_IB_ROCE_VERSION_NUM: "2"
  NCCL_IB_ADDR_FAMILY: "AF_INET"
  NCCL_CROSS_NIC: "1"
  NCCL_IGNORE_CPU_AFFINITY: "1"
  NCCL_CUMEM_ENABLE: "0"
  NCCL_NVLS_ENABLE: "0"
  NCCL_MAX_NCHANNELS: "4"                              # 4 beats the built-in 64 on this kit: +10% tok/s at
                                                      # 32 concurrent, +7% at 64, same at 1. No GPUDirect RDMA
                                                      # on the GB10, so 64 channels copies every large message
                                                      # through host memory; 4 does not.

vllm:                                                  # section name kept: run.sh reads one flat ns
  served-model-name: qwen3.8-flash-next                 # overridden by lib-lanes.sh (CHECKPOINT)
  max-model-len: 262144                                # the model's native max
  max-num-seqs: 12                                     # single-stream lane: 12 seats is ample and leaves
                                                      # the largest KV headroom. RAISE THIS for concurrency
                                                      # only after the TP2 path is validated — see docs/ENGINES.md
  kv-cache-memory: "41000000000"                        # 41G per box = 2,500,128 pooled KV tokens in bf16
  dtype: bfloat16
  enforce-eager: "false"                               # CUDA graphs on; the patch set is graph-safe
  mtp-drafts: 5                                         # speculative depth K=5. Measured sweep: depth 3 and 5 tie
                                                      # (65.3 / 64.6 tok/s) and the yield-vs-cadence curve is
                                                      # FLAT, so depth relocates throughput rather than raising it
  thinking-budget: 0                                    # reasoning off for the benchmark numbers above
  # --- the accepted optimization: ordered FP32 reduction -------------------------------------------
  # Acceptance is what drives throughput on this model (cadence stays in a narrow 20.6-23.0 Hz band
  # while acceptance swings 1.96x on prompt). The original PLE/target-verify chain accumulated in FP32
  # with copy->ascending-adds->scale->TP-order; the fused Triton reducer does the same arithmetic with
  # 3.40x less kernel time at high split-K, and is BIT-IDENTICAL: token_sha a8186d024c48 across all
  # trials, 210/210 bitwise vs the original Python chain (eager + CUDA graph, adversarial /
  # subnormal / signed-zero, real production N 320/2560/3072/6144) and 210/210 on the manual PTX
  # dependency review (no add.rn.ftz, no fma.rn, every add after the first consumes the prior
  # accumulator, inferred split-K == case split-K).
  # Set to "python" to reproduce the original chain; "triton" is the default and the fast path.
  f32-reducer: triton
